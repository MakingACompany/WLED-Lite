name: Build WLED-Lite

# Single build target: Seeed XIAO ESP32-S3 Plus (16 MB, xiao_esp32s3_plus).
#
# Every push to main: firmware artifact stored for 90 days.
# Tagged releases (v*.*.*): .bin attached permanently to GitHub Release.
#
# To OTA-update a running device via FlashLight:
#   Download firmware artifact → drag WLED_*_XIAO_ESP32S3_LITE.bin to
#   http://flashlight.local/flash.html

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build xiao_esp32s3_plus
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # WLED's web UI is built from source via npm (build_ui.py pre-build script)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.buildcache
            build_output
          key: pio-${{ runner.os }}-xiao_esp32s3_plus-${{ hashFiles('platformio.ini') }}-${{ hashFiles('wled00/**') }}
          restore-keys: |
            pio-${{ runner.os }}-xiao_esp32s3_plus-${{ hashFiles('platformio.ini') }}-

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Build firmware
        run: pio run -e xiao_esp32s3_plus

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wled-lite-${{ github.sha }}
          path: build_output/release/*.bin
          if-no-files-found: warn

      - name: Attach firmware to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/release/*.bin

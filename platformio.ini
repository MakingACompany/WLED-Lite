; PlatformIO Project Configuration File
; Please visit documentation: https://docs.platformio.org/page/projectconf.html
;
; WLED-Lite is narrowed to the ESP32-S3 family. The primary target is the
; Seeed Studio XIAO ESP32-S3 Plus (env:xiao_esp32s3_plus); three generic
; S3 dev envs are retained for A/B testing while bringing up the XIAO Plus.
; Upstream WLED supports many more boards (ESP8266, classic ESP32, ESP32-S2,
; ESP32-C3, HUB75 matrix panels, etc.) — refer back to the upstream wled/WLED
; repo and re-import the relevant env block(s) if those targets are ever
; needed again.

[platformio]
# ------------------------------------------------------------------------------
# ENVIRONMENTS
#
# WLED-Lite: primary target is xiao_esp32s3_plus.
# esp32s3dev_16MB_opi is retained as a parity smoke-test env (it is also
# the parent of xiao_esp32s3_plus).
# Other S3 envs (8MB_opi, 4M_qspi) are available but not built by default;
# use `pio run -e <env>` to build them.
# ------------------------------------------------------------------------------

default_envs = xiao_esp32s3_plus
               esp32s3dev_16MB_opi

src_dir  = ./wled00
data_dir = ./wled00/data
build_cache_dir = ~/.buildcache
extra_configs =
  platformio_override.ini
  platformio_release.ini

[common]
# ------------------------------------------------------------------------------
# FLAGS: DEBUG
# esp32   : see https://docs.platformio.org/en/latest/platforms/espressif32.html#debug-level
# ------------------------------------------------------------------------------
debug_flags = -D DEBUG=1 -D WLED_DEBUG

# ------------------------------------------------------------------------------
build_flags =
  -DMQTT_MAX_PACKET_SIZE=1024
  -DSECURE_CLIENT=SECURE_CLIENT_BEARSSL
  -DBEARSSL_SSL_BASIC
  -D CORE_DEBUG_LEVEL=0
  -D NDEBUG
  -Wno-attributes ;; silence warnings about unknown attribute 'maybe_unused' in NeoPixelBus
  #build_flags for the IRremoteESP8266 library (enabled decoders have to appear here)
  -D _IR_ENABLE_DEFAULT_=false
  -D DECODE_HASH=true
  -D DECODE_NEC=true
  -D DECODE_SONY=true
  -D DECODE_SAMSUNG=true
  -D DECODE_LG=true
  -DWLED_USE_MY_CONFIG
  -D WLED_PS_DONT_REPLACE_FX ; PS replacement FX are purely a flash memory saving feature, do not replace classic FX until we run out of flash

build_unflags =

[scripts_defaults]
extra_scripts =
  pre:pio-scripts/set_metadata.py
  post:pio-scripts/output_bins.py
  post:pio-scripts/strip-floats.py
  post:pio-scripts/dynarray.py
  pre:pio-scripts/user_config_copy.py
  pre:pio-scripts/load_usermods.py
  pre:pio-scripts/build_ui.py
  post:pio-scripts/validate_modules.py  ;; double-check the build output usermods
  ; post:pio-scripts/obj-dump.py  ;; convenience script to create a disassembly dump of the firmware (hardcore debugging)

# ------------------------------------------------------------------------------
# COMMON SETTINGS:
# ------------------------------------------------------------------------------
[env]
framework = arduino
board_build.flash_mode = dout
monitor_speed = 115200
# slow upload speed but most compatible (use platformio_override.ini to use faster speed)
upload_speed = 115200

# ------------------------------------------------------------------------------
# LIBRARIES: required dependencies
#   Please note that we don't always use the latest version of a library.
#
#   The following libraries have been included (and some of them changed) in the source:
#     ArduinoJson@5.13.5, E131@1.0.0(changed), Time@1.5, Timezone@1.2.1
# ------------------------------------------------------------------------------
lib_compat_mode = strict
lib_deps =
    IRremoteESP8266 @ 2.8.2
    https://github.com/Makuna/NeoPixelBus.git#a0919d1c10696614625978dd6fb750a1317a14ce
    https://github.com/Aircoookie/ESPAsyncWebServer.git#v2.4.2
    marvinroger/AsyncMqttClient @ 0.9.0
  # for I2C interface
    ;Wire
  # ESP-NOW library
    ;gmag11/QuickESPNow @ ~0.7.0
    https://github.com/blazoncek/QuickESPNow.git#optional-debug
  #For compatible OLED display uncomment following
    #olikraus/U8g2 #@ ~2.33.15
  #For Dallas sensor uncomment following
    #paulstoffregen/OneWire @ ~2.3.8
  #For BME280 sensor uncomment following
    #BME280 @ ~3.0.0
    ;adafruit/Adafruit BMP280 Library @ 2.1.0
    ;adafruit/Adafruit CCS811 Library @ 1.0.4
    ;adafruit/Adafruit Si7021 Library @ 1.4.0
  #For MAX1704x Lipo Monitor / Fuel Gauge uncomment following
    ; https://github.com/adafruit/Adafruit_BusIO @ 1.14.5
    ; https://github.com/adafruit/Adafruit_MAX1704X @ 1.0.2
  #For MPU6050 IMU uncomment follwoing
    ;electroniccats/MPU6050 @1.0.1
  # SHT85
    ;robtillaart/SHT85@~0.3.3

extra_scripts = ${scripts_defaults.extra_scripts}

[esp32_all_variants]
lib_deps =
  esp32async/AsyncTCP @ 3.4.7
  bitbank2/AnimatedGIF@^1.4.7
  https://github.com/Aircoookie/GifDecoder.git#bc3af189b6b1e06946569f6b4287f0b79a860f8e
build_flags =
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
  -D WLED_ENABLE_GIF

[esp32]
;; Shared partition-table references used by all ESP32 variants below.
;; (The classic-ESP32 platform settings that used to live here were removed
;; with the classic-ESP32 build envs.)
platform = ${esp32_idf_V4.platform}
platform_packages =
build_unflags = ${common.build_unflags}
build_flags = ${esp32_idf_V4.build_flags}
lib_deps = ${esp32_idf_V4.lib_deps}
monitor_filters = esp32_exception_decoder

tiny_partitions = tools/WLED_ESP32_2MB_noOTA.csv
default_partitions = tools/WLED_ESP32_4MB_1MB_FS.csv
extended_partitions = tools/WLED_ESP32_4MB_700k_FS.csv
big_partitions = tools/WLED_ESP32_4MB_256KB_FS.csv     ;; 1.8MB firmware, 256KB filesystem, coredump support
large_partitions = tools/WLED_ESP32_8MB.csv
extreme_partitions = tools/WLED_ESP32_16MB_9MB_FS.csv

board_build.partitions = ${esp32.default_partitions}   ;; default partioning for 4MB Flash - can be overridden in build envs
# additional build flags for audioreactive - must be applied globally
AR_build_flags = ;; -fsingle-precision-constant ;; forces ArduinoFFT to use float math (2x faster)
AR_lib_deps =  ;; for pre-usermod-library platformio_override compatibility


[esp32_idf_V4]
;; build environment for ESP32 using ESP-IDF 4.4.x / arduino-esp32 v2.0.5
;; *** important: build flags from esp32_idf_V4 are inherited by _all_ esp32-based MCUs.

platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.00/platform-espressif32.zip ;; Tasmota Arduino Core 2.0.18 with IPv6 support, based on IDF 4.4.8
platform_packages =
build_unflags = ${common.build_unflags}
build_flags = -g
  -Wshadow=compatible-local ;; emit warning in case a local variable "shadows" another local one
  -DARDUINO_ARCH_ESP32 -DESP32
  ${esp32_all_variants.build_flags}
  -D WLED_ENABLE_DMX_INPUT
lib_deps =
  ${esp32_all_variants.lib_deps}
  https://github.com/someweisguy/esp_dmx.git#47db25d8c515e76fabcf5fc5ab0b786f98eeade0
  ${env.lib_deps}

[esp32s3]
;; generic definitions for all ESP32-S3 boards
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
build_unflags = ${common.build_unflags}
build_flags = -g
  -DESP32
  -DARDUINO_ARCH_ESP32
  -DARDUINO_ARCH_ESP32S3
  -DCONFIG_IDF_TARGET_ESP32S3=1
  -DARDUINO_USB_MSC_ON_BOOT=0 -DARDUINO_DFU_ON_BOOT=0
  -DCO
  ;; please make sure that the following flags are properly set (to 0 or 1) by your board.json, or included in your custom platformio_override.ini entry:
  ;; ARDUINO_USB_MODE, ARDUINO_USB_CDC_ON_BOOT
  ${esp32_idf_V4.build_flags}
lib_deps =
  ${esp32_idf_V4.lib_deps}
board_build.partitions = ${esp32.large_partitions}   ;; default partioning for 8MB flash - can be overridden in build envs
upload_speed = 921600
monitor_filters = esp32_exception_decoder


# ------------------------------------------------------------------------------
# WLED-LITE BUILDS
# ------------------------------------------------------------------------------

[env:xiao_esp32s3_plus]
;; Seeed Studio XIAO ESP32-S3 Plus — primary WLED-Lite target.
;; 16MB flash + 8MB PSRAM (OPI assumed; verify on first flash, see project plan).
;; USB-C is used for both programming and serial debug, so USB-CDC must stay on.
;;
;; build_flags are built directly from common + esp32s3 (rather than inheriting
;; from env:esp32s3dev_16MB_opi.build_flags) so that the parent's
;; WLED_RELEASE_NAME does not leak in — output_bins.py picks the FIRST
;; WLED_RELEASE_NAME in CPPDEFINES for the release filename, even though the C
;; preprocessor honors the last -D. Board hardware settings (memory_type,
;; partitions, flash size, etc.) are still inherited via `extends`.
;;
;; OTA caveat: WLED_RELEASE_NAME ("XIAO_ESP32S3_LITE") is embedded at a fixed
;; offset and OTA refuses cross-release updates. Do not change it once devices
;; are deployed — those devices would need a USB reflash to recover.
extends = env:esp32s3dev_16MB_opi
board = seeed_xiao_esp32s3
;; Inherit audioreactive from the parent; add INA219 current-monitor.
;; See usermods/INA219/README.md and docs/current-limit-ina219.md.
custom_usermods = audioreactive INA219
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  -D WLED_WATCHDOG_TIMEOUT=0
  -DBOARD_HAS_PSRAM
  -D WLED_BRAND=\"WLED-Lite\"
  -D WLED_PRODUCT_NAME=\"WLED-Lite\"
  -D WLED_RELEASE_NAME=\"XIAO_ESP32S3_LITE\"
  -D WLED_REPO=\"MakingACompany/WLED-Lite\"
  ;; USB-CDC must stay enabled for programming + debug over USB-C
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ;; --- WLED-Lite scope reductions (see docs/feature-flag-audit.md) ---
  -D WLED_DISABLE_2D
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_PARTICLESYSTEM2D
  -D WLED_DISABLE_PIXELFORGE
  ;; --- WLED-Lite admin / scope additions ---
  -D WLED_ENABLE_DMX
  -D WLED_ENABLE_DMX_OUTPUT
  -D WLED_ENABLE_USERMOD_PAGE
  ;; --- WLED-Lite curated effects (see docs/fx-curation.md) ---
  -D WLED_LITE_FX_TRIM
  ;; --- XIAO ESP32-S3 Plus carrier-board pin defaults (see docs/hardware-pinmap.md) ---
  ;; 8 LED outputs: front pins D3,D8,D9,D10 + Plus sub-header pins
  -D DATA_PINS=4,7,8,9,10,11,12,13
  -D LED_TYPES=TYPE_WS2812_RGB
  -D PIXEL_COUNTS=30,30,30,30,30,30,30,30
  ;; 2 buttons on D0,D1 (ADC1-capable, easy front access)
  -D BTNPIN=1,2
  ;; I2C on XIAO defaults D4 (SDA), D5 (SCL) — INA219, OLED, etc.
  -D HW_PIN_SDA=5
  -D HW_PIN_SCL=6
  ;; --- WLED-Lite button-binding FSM (see docs/button-bindings.md) ---
  -D WLED_LITE_BUTTON_BRIGHTNESS_MODE
  ;; --- WLED-Lite multi-controller sync defaults (see docs/multi-controller-sync.md) ---
  -D WLED_LITE_SYNC_DEFAULTS
  ;; --- WLED-Lite security gates (see docs/ui-split-design.md) ---
  ;; - / redirects to /welcome until a PIN is set (forces 3-step wizard on fresh devices)
  ;; - /reset requires PIN (matches /update + /settings auth model)
  -D WLED_LITE_SECURITY_GATES

[env:esp32s3dev_16MB_opi]
;; ESP32-S3 development board, with 16MB FLASH and >= 8MB PSRAM (memory_type: qio_opi)
;; Also serves as the parent for env:xiao_esp32s3_plus.
extends = esp32s3
board = esp32-s3-devkitc-1 ;; generic dev board; the next line adds PSRAM support
board_build.arduino.memory_type = qio_opi     ;; use with PSRAM: 8MB or 16MB
custom_usermods = audioreactive
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-S3_16MB_opi\"
  -D WLED_WATCHDOG_TIMEOUT=0
  ;-D ARDUINO_USB_CDC_ON_BOOT=0  ;; -D ARDUINO_USB_MODE=1 ;; for boards with serial-to-USB chip
  -D ARDUINO_USB_CDC_ON_BOOT=1 ;; -D ARDUINO_USB_MODE=1      ;; for boards with USB-OTG connector only (USBCDC or "TinyUSB")
  -DBOARD_HAS_PSRAM
board_build.partitions = ${esp32.extreme_partitions}
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio

[env:esp32s3dev_8MB_opi]
;; ESP32-S3 development board, with 8MB FLASH and >= 8MB PSRAM (memory_type: qio_opi)
extends = esp32s3
board = esp32-s3-devkitc-1 ;; generic dev board; the next line adds PSRAM support
board_build.arduino.memory_type = qio_opi     ;; use with PSRAM: 8MB or 16MB
custom_usermods = audioreactive
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-S3_8MB_opi\"
  -D WLED_WATCHDOG_TIMEOUT=0
  ;-D ARDUINO_USB_CDC_ON_BOOT=0  ;; -D ARDUINO_USB_MODE=1 ;; for boards with serial-to-USB chip
  -D ARDUINO_USB_CDC_ON_BOOT=1 ;; -D ARDUINO_USB_MODE=1      ;; for boards with USB-OTG connector only (USBCDC or "TinyUSB")
  -DBOARD_HAS_PSRAM
board_build.f_flash = 80000000L
board_build.flash_mode = qio

[env:esp32s3_4M_qspi]
;; ESP32-S3, with 4MB FLASH and <= 4MB PSRAM (memory_type: qio_qspi)
extends = esp32s3
board = lolin_s3_mini ;; -S3 mini, 4MB flash 2MB PSRAM
custom_usermods = audioreactive
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-S3_4M_qspi\"
  -DARDUINO_USB_CDC_ON_BOOT=1 ;; -DARDUINO_USB_MODE=1      ;; for boards with USB-OTG connector only (USBCDC or "TinyUSB")
  -DBOARD_HAS_PSRAM
  -DLOLIN_WIFI_FIX ; seems to work much better with this
  -D WLED_WATCHDOG_TIMEOUT=0
board_build.partitions = ${esp32.default_partitions}
board_build.f_flash = 80000000L
board_build.flash_mode = qio

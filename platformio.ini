; PlatformIO Project Configuration File
;
; Target: Seeed Studio XIAO ESP32-S3 Plus (ESP32-S3R8: 16 MB QIO flash,
; 8 MB OPI PSRAM). Single self-contained build environment.
;
; Board quirk: do NOT use Seeed's stock seeed_xiao_esp32s3 board JSON —
; it selects variant=XIAO_ESP32S3 which boot-loops on rev 0.2 hardware.
; boards/xiao_esp32s3_plus_n16r8v.json uses variant=esp32s3 instead.
;
; To enable optional usermods (rotary encoder, temperature sensor, etc.),
; append their directory name to custom_usermods below.

[platformio]
default_envs    = xiao_esp32s3_plus
src_dir         = ./wled00
data_dir        = ./wled00/data
build_cache_dir = ~/.buildcache
boards_dir      = boards
extra_configs   =
  platformio_override.ini
  platformio_release.ini

[env:xiao_esp32s3_plus]
; Tasmota Arduino Core 2.0.18 (arduino-esp32 v2.x, IDF 4.4.8)
platform          = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.00/platform-espressif32.zip
platform_packages =
framework         = arduino
board             = xiao_esp32s3_plus_n16r8v

; Board memory and flash (boards_dir is set in [platformio] above)
board_build.arduino.memory_type = qio_opi
board_build.partitions          = tools/WLED_ESP32_16MB_9MB_FS.csv
board_build.f_flash             = 80000000L
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

; Serial / upload
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder

; Active usermods — add names from usermods/ here to compile them in.
; See readme.md for the available set and upstream WLED for more.
custom_usermods = audioreactive INA219

lib_compat_mode = strict

lib_deps =
  ; Networking
  esp32async/AsyncTCP @ 3.4.7
  https://github.com/Aircoookie/ESPAsyncWebServer.git#v2.4.2
  marvinroger/AsyncMqttClient @ 0.9.0
  https://github.com/blazoncek/QuickESPNow.git#optional-debug
  ; LED output
  https://github.com/Makuna/NeoPixelBus.git#a0919d1c10696614625978dd6fb750a1317a14ce
  ; IR remote
  IRremoteESP8266 @ 2.8.2
  ; GIF animation
  bitbank2/AnimatedGIF@^1.4.7
  https://github.com/Aircoookie/GifDecoder.git#bc3af189b6b1e06946569f6b4287f0b79a860f8e
  ; DMX input
  https://github.com/someweisguy/esp_dmx.git#47db25d8c515e76fabcf5fc5ab0b786f98eeade0
  ; Uncomment to support optional usermods:
  ;paulstoffregen/OneWire @ ~2.3.8    ; Temperature usermod (DS18B20)
  ;olikraus/U8g2                      ; display usermods

extra_scripts =
  pre:pio-scripts/set_metadata.py
  post:pio-scripts/output_bins.py
  post:pio-scripts/strip-floats.py
  post:pio-scripts/dynarray.py
  pre:pio-scripts/user_config_copy.py
  pre:pio-scripts/load_usermods.py
  pre:pio-scripts/build_ui.py
  post:pio-scripts/validate_modules.py
  ; post:pio-scripts/obj-dump.py    ; uncomment for ELF disassembly dump

build_unflags =

build_flags =
  ; --- Compiler ---
  -g
  -Wshadow=compatible-local
  -Wno-attributes

  ; --- ESP32-S3 architecture ---
  -DESP32
  -DARDUINO_ARCH_ESP32
  -DARDUINO_ARCH_ESP32S3
  -DCONFIG_IDF_TARGET_ESP32S3=1
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_DFU_ON_BOOT=0
  -DCO
  -DBOARD_HAS_PSRAM

  ; --- USB-CDC: required for serial and programming over USB-C ---
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

  ; --- WLED core ---
  -DMQTT_MAX_PACKET_SIZE=1024
  -DSECURE_CLIENT=SECURE_CLIENT_BEARSSL
  -DBEARSSL_SSL_BASIC
  -DCORE_DEBUG_LEVEL=0
  -DNDEBUG
  -DWLED_USE_MY_CONFIG
  -DWLED_PS_DONT_REPLACE_FX
  -DWLED_WATCHDOG_TIMEOUT=0
  -DWLED_ENABLE_GIF
  -DWLED_ENABLE_DMX_INPUT

  ; --- Async TCP ---
  -DCONFIG_ASYNC_TCP_USE_WDT=0
  -DCONFIG_ASYNC_TCP_STACK_SIZE=8192

  ; --- IR decoders ---
  -D_IR_ENABLE_DEFAULT_=false
  -DDECODE_HASH=true
  -DDECODE_NEC=true
  -DDECODE_SONY=true
  -DDECODE_SAMSUNG=true
  -DDECODE_LG=true

  ; --- WLED-Lite identity ---
  -DWLED_BRAND=\"WLED-Lite\"
  -DWLED_PRODUCT_NAME=\"WLED-Lite\"
  -DWLED_REPO=\"MakingACompany/WLED-Lite\"
  -DWLED_RELEASE_NAME=\"XIAO_ESP32S3_LITE\"

  ; --- Upstream features disabled (binary size + attack surface) ---
  -DWLED_DISABLE_2D
  -DWLED_DISABLE_ALEXA
  -DWLED_DISABLE_HUESYNC
  -DWLED_DISABLE_INFRARED
  -DWLED_DISABLE_LOXONE
  -DWLED_DISABLE_PARTICLESYSTEM2D
  -DWLED_DISABLE_PIXELFORGE

  ; --- WLED-Lite additions ---
  -DWLED_ENABLE_USERMOD_PAGE
  -DWLED_LITE_FX_TRIM
  -DWLED_LITE_BUTTON_BRIGHTNESS_MODE
  -DWLED_LITE_SYNC_DEFAULTS
  -DWLED_LITE_SECURITY_GATES
  -DWLED_LITE_SCHEDULE
  -DWLED_LITE_SEGMENTS

  ; --- Hardware pins: XIAO ESP32-S3 Plus carrier board ---
  ; LED on GPIO2 (D1). Buttons on GPIO1 + GPIO4. I2C on D4/D5.
  ; Status LED on GPIO44 (D7, repurposed — USB-CDC handles serial).
  -DDATA_PINS=2
  -DLED_TYPES=TYPE_WS2812_RGB
  -DPIXEL_COUNTS=30
  -DBTNPIN=1,4
  -DHW_PIN_SDA=5
  -DHW_PIN_SCL=6
  -DSTATUSLED=44

  ; --- NTP / scheduling ---
  -DWLED_NTP_ENABLED=true
  -DNTP_SYNC_INTERVAL=300UL
  -DWLED_LITE_NTP_SERVER=\"time.nist.gov\"

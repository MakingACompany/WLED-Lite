<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WLED-Lite</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<div id="status" class="status" aria-live="polite" hidden>Reconnecting…</div>

<header class="header">
  <h1 class="brand">
    <span class="brand__main">WLED</span><span class="brand__mark">·</span><em class="brand__sub">lite</em>
  </h1>
  <a href="/settings" class="gear" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
    </svg>
  </a>
</header>

<main class="stack">

  <section class="card power">
    <button id="power" class="power__btn" aria-pressed="false" aria-label="Power">
      <span class="power__halo"></span>
      <span class="power__icon">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
      </span>
    </button>
    <p class="power__state" id="power-state">Off</p>
  </section>

  <section class="card">
    <label class="card__label" for="bri">Brightness</label>
    <div class="slider-row">
      <input id="bri" class="slider" type="range" min="1" max="255" value="128" step="1" aria-label="Brightness">
      <output class="slider-val" id="bri-val" for="bri">50%</output>
    </div>
  </section>

  <section class="card">
    <label class="card__label">Color</label>
    <div id="picker" class="picker"></div>
  </section>

  <section class="card">
    <label class="card__label">Effect</label>
    <ul id="effects" class="effects" role="listbox" aria-label="Effects">
      <li class="effect skel"></li><li class="effect skel"></li><li class="effect skel"></li>
    </ul>
  </section>

  <section class="card">
    <label class="card__label">Turn off in</label>
    <div class="timer" id="timer" role="group" aria-label="Auto-off timer">
      <button class="timer__btn is-on" data-min="0">Never</button>
      <button class="timer__btn" data-min="60">1 hr</button>
      <button class="timer__btn" data-min="240">4 hr</button>
      <button class="timer__btn" data-min="720">12 hr</button>
    </div>
  </section>

  <section class="card">
    <label class="card__label">Daily schedule</label>
    <p class="schedule__hint">Turn on at the same time every day, then off at a later time. Uses the time of day on the device — make sure the time zone is set in Settings → Time.</p>
    <div class="schedule">
      <label class="schedule__row">
        <span class="schedule__name">On at</span>
        <input id="sched-on" class="schedule__input" type="time" value="18:00" required>
      </label>
      <label class="schedule__row">
        <span class="schedule__name">Off at</span>
        <input id="sched-off" class="schedule__input" type="time" value="00:00" required>
      </label>
    </div>
    <div class="schedule__actions">
      <button id="sched-save" class="schedule__btn schedule__btn--primary">Save schedule</button>
      <button id="sched-clear" class="schedule__btn">Clear</button>
    </div>
    <p id="sched-status" class="schedule__status" aria-live="polite"></p>
  </section>

</main>

<footer class="footer">
  <span class="footer__name" id="dev-name">WLED-Lite</span>
</footer>

<script src="iro.js"></script>
<script src="index.js"></script>
</body>
</html>
